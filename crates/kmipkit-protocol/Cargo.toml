[package]
name = "kmipkit-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kmipkit-protocol"
readme = "../../README.md"
keywords = ["kmip", "kms", "hsm", "cryptography", "oasis"]
categories = ["cryptography", "api-bindings", "network-programming"]
description = "KMIP protocol models and validation for KMIPKit"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
test-support = []

[dependencies]
kmipkit-ttlv.workspace = true
zeroize.workspace = true

[dev-dependencies]
quickcheck = { version = "=1.1.0", default-features = false }
roxmltree.workspace = true
serde_json.workspace = true

[lints]
workspace = true
