[package]
name = "kmipkit-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/kmipkit-client"
readme = "../../README.md"
keywords = ["kmip", "kms", "hsm", "cryptography", "oasis"]
categories = ["cryptography", "api-bindings", "network-programming"]
description = "KMIP client orchestration for KMIPKit"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[features]
test-support = ["kmipkit-transport/test-support"]

[dependencies]
kmipkit-protocol.workspace = true
kmipkit-transport.workspace = true
kmipkit-ttlv.workspace = true
zeroize.workspace = true
quick-xml = { version = "=0.42.0", default-features = false }

[dev-dependencies]
rustls-openssl.workspace = true
roxmltree.workspace = true
static_assertions = { version = "=1.1.0", default-features = false }
kmipkit-protocol = { workspace = true, features = ["test-support"] }
serde = "=1.0.228"
serde_json.workspace = true
quickcheck = { version = "=1.1.0", default-features = false }
kmipkit-test-support = { workspace = true, features = ["fixtures", "scripted-transport"] }
rustls.workspace = true
tokio.workspace = true
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
trybuild = "=1.0.121"

[lints]
workspace = true
