quickcheck = { version = "=1.1.0", default-features = false }
kmipkit-test-support = { workspace = true, features = ["scripted-transport"] }
rustls.workspace = true
tokio.workspace = true
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
trybuild = "=1.0.121"

[lints]
workspace = true
