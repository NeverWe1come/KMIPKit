[package]
name = "kmipkit-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "KMIP client orchestration for KMIPKit"

[dependencies]
kmipkit-protocol.workspace = true
kmipkit-transport.workspace = true
kmipkit-ttlv.workspace = true
zeroize.workspace = true

[dev-dependencies]
