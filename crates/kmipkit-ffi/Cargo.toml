[package]
name = "kmipkit-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Stable C ABI for KMIPKit"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
coverage-c-consumer = []

[dependencies]
aws-lc-rs.workspace = true
kmipkit.workspace = true
kmipkit-client.workspace = true
kmipkit-protocol.workspace = true
kmipkit-transport.workspace = true
kmipkit-ttlv.workspace = true
zeroize.workspace = true

[build-dependencies]
cc = "=1.6.0"

[dev-dependencies]
kmipkit-test-support = { workspace = true, features = ["fixtures"] }
base64 = "=0.23.1"
rcgen = { workspace = true, features = ["pem"] }
rustls.workspace = true
serde_json.workspace = true

[lints]
workspace = true
