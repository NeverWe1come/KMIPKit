[graph]
all-features = true

[advisories]
ignore = []
unsound = "all"
unmaintained = "all"
yanked = "deny"

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = false
deny = [
    # ADR-0005 selects rustls with aws-lc-rs for TLS; reject alternate TLS backends.
    "native-tls",
    "openssl",
    "openssl-sys",
]
skip = [
    { crate = "core-foundation@0.9.4", reason = "KMIPKIT-0011-EX-001: approved Apple DNS dependency split" },
    { crate = "core-foundation@0.10.1", reason = "KMIPKIT-0011-EX-002: approved Apple trust-store dependency split" },
    { crate = "syn@2.0.119", reason = "KMIPKIT-0011-EX-003: approved proc-macro dependency split" },
    { crate = "syn@3.0.6", reason = "KMIPKIT-0011-EX-004: approved patched ICU proc-macro dependency" },
]

[licenses]
include-dev = true
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "NCSA", "Unicode-3.0", "Unlicense"]
exceptions = []

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
