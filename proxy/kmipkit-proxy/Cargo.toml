[package]
name = "kmipkit-proxy"
version = "1.0.0"
edition = "2024"
authors = ["KMIPKit Authors"]
license = "Apache-2.0"
description = "Zero-DB Stateless Cloud KMS Bridge for KMIP 2.0, 2.1, and 3.0"
readme = "README.md"
keywords = ["kmip", "kms", "cloud", "security", "encryption"]
categories = ["cryptography", "network-programming"]

[[bin]]
name = "kmipkit-proxy"
path = "src/main.rs"

[features]
default = []
all-clouds = ["aws", "azure", "gcp", "oci"]
aws = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-sdk-secretsmanager"]
azure = ["dep:azure_security_keyvault_keys", "dep:azure_security_keyvault_secrets", "dep:azure_identity", "dep:azure_core"]
gcp = ["dep:reqwest"]
oci = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.5", optional = true, default-features = false, features = ["rustls", "default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1.52", optional = true, default-features = false, features = ["rustls", "default-https-client", "rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.52", optional = true, default-features = false, features = ["rustls", "default-https-client", "rt-tokio"] }
azure_security_keyvault_keys = { version = "1.1.0-beta.1", optional = true }
azure_security_keyvault_secrets = { version = "1.1.0-beta.1", optional = true }
azure_identity = { version = "1.1.0-beta.2", optional = true }
azure_core = { version = "1.2.0-beta.2", optional = true, features = ["test"] }
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["prebuilt-nasm"] }
base64 = "0.22"
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
kmipkit-protocol = { path = "../../crates/kmipkit-protocol" }
kmipkit-transport = { path = "../../crates/kmipkit-transport" }
kmipkit-ttlv = { path = "../../crates/kmipkit-ttlv" }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"], optional = true }
roxmltree = "=0.21.1"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
kmipkit-client = { path = "../../crates/kmipkit-client" }
tempfile = "3.16"
toml = "0.8"
