[workspace]

[package]
name = "kmipkit-proxy"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Zero-DB Stateless KMIP 2.0/2.1/3.0 Proxy Bridge for AWS, Azure, Google Cloud, and Oracle OCI"
publish = false

[[bin]]
name = "kmipkit-proxy"
path = "src/main.rs"

[features]
default = ["all-clouds"]
all-clouds = ["aws", "azure", "gcp", "oci"]
aws = []
azure = []
gcp = []
oci = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["prebuilt-nasm"] }
base64 = "0.22"
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
kmipkit-protocol = { path = "../../crates/kmipkit-protocol" }
kmipkit-transport = { path = "../../crates/kmipkit-transport" }
kmipkit-ttlv = { path = "../../crates/kmipkit-ttlv" }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"], optional = true }
roxmltree = "=0.21.1"
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time", "signal"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
toml = "0.8"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
kmipkit-client = { path = "../../crates/kmipkit-client" }
tempfile = "3"

[patch.crates-io]
aws-lc-sys = { path = "../../vendor/aws-lc-sys-0.45.0" }
