[workspace]

[package]
name = "kmipkit-proxy"
version = "1.0.0"
edition = "2024"
authors = ["KMIPKit Authors"]
license = "Apache-2.0"
description = "Zero-DB Stateless Cloud KMS Bridge and KMIP 1.X -> 2.0/2.1/3.0 Protocol Translation Proxy"
readme = "README.md"
keywords = ["kmip", "kms", "cloud", "security", "encryption"]
categories = ["cryptography", "network-programming"]
publish = false

[[bin]]
name = "kmipkit-proxy"
path = "src/main.rs"

[features]
default = ["kmip1x-bridge"]
kmip1x-bridge = []
all-clouds = [
  "kmip1x-bridge",
  "aws",
  "azure",
  "gcp",
  "oci",
  "vault",
  "infisical",
  "ibm",
  "alibaba",
  "scaleway",
  "otc",
]
aws = [
  "dep:aws-config",
  "dep:aws-sdk-kms",
  "dep:aws-sdk-secretsmanager",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:reqwest",
  "dep:http",
  "reqwest/http2",
  "reqwest/stream",
  "dep:rustls-native-certs",
]
azure = [
  "dep:azure_security_keyvault_keys",
  "dep:azure_security_keyvault_secrets",
  "dep:azure_identity",
  "dep:azure_core",
  "dep:reqwest-azure",
]
gcp = ["dep:reqwest"]
oci = ["dep:reqwest"]
vault = ["dep:reqwest"]
infisical = ["dep:reqwest"]
ibm = ["dep:reqwest"]
alibaba = ["dep:reqwest"]
scaleway = ["dep:reqwest"]
otc = ["dep:reqwest"]

[dependencies]
http = { version = "1", optional = true }
async-trait = "0.1"
aws-config = { version = "1.5", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-kms = { version = "1.52", optional = true, default-features = false, features = ["rt-tokio"] }
aws-sdk-secretsmanager = { version = "1.52", optional = true, default-features = false, features = ["rt-tokio"] }
aws-smithy-runtime-api = { version = "1.19", optional = true, default-features = false, features = ["client", "http-1x"] }
aws-smithy-types = { version = "1.9", optional = true, default-features = false, features = ["http-body-1-x"] }
azure_security_keyvault_keys = { version = "1.1.0-beta.1", optional = true, default-features = false }
azure_security_keyvault_secrets = { version = "1.1.0-beta.1", optional = true, default-features = false }
azure_identity = { version = "1.1.0-beta.2", optional = true, default-features = false, features = ["reqwest", "tokio"] }
azure_core = { version = "1.2.0-beta.2", optional = true, default-features = false, features = ["reqwest", "reqwest_deflate", "reqwest_gzip", "tokio", "test", "hmac_openssl"] }
openssl = "=0.10.82"
base64 = "0.22"
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
kmipkit-client = { path = "../crates/kmipkit-client" }
kmipkit-protocol = { path = "../crates/kmipkit-protocol" }
kmipkit-transport = { path = "../crates/kmipkit-transport" }
kmipkit-ttlv = { path = "../crates/kmipkit-ttlv" }
reqwest-azure = { package = "reqwest", version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "stream"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-no-provider"], optional = true }
roxmltree = "=0.21.1"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-openssl = "=0.4.2"
rustls-native-certs = { version = "=0.8.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["tls12"] }
toml = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.16"
