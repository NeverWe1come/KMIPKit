# Official Read the Docs v2 configuration (place at repository root or bindings/python/)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: bindings/python/docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: bindings/python
      extra_requirements:
        - docs
