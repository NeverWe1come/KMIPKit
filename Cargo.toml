[workspace]
members = [
    "crates/kmipkit-ttlv",
    "crates/kmipkit-protocol",
    "crates/kmipkit-transport",
    "crates/kmipkit-client",
    "crates/kmipkit",
    "crates/kmipkit-ffi",
    "crates/kmipkit-test-support",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/NeverWe1come/KMIPKit"

[workspace.dependencies]
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["prebuilt-nasm"] }
bytes = { version = "=1.12.1", default-features = false, features = ["std"] }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
roxmltree = "=0.21.1"
serde_json = "=1.0.151"
kmipkit-ttlv = { path = "crates/kmipkit-ttlv", version = "0.1.0" }
kmipkit-protocol = { path = "crates/kmipkit-protocol", version = "0.1.0" }
kmipkit-transport = { path = "crates/kmipkit-transport", version = "0.1.0" }
kmipkit-client = { path = "crates/kmipkit-client", version = "0.1.0" }
kmipkit = { path = "crates/kmipkit", version = "0.1.0" }
kmipkit-ffi = { path = "crates/kmipkit-ffi", version = "0.1.0" }
kmipkit-test-support = { path = "crates/kmipkit-test-support", version = "0.1.0", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = { version = "=0.8.4", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
rust_2018_idioms = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
