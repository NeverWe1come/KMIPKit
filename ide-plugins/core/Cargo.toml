[workspace]

[package]
name = "kmip-lsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Shared LSP server, TTLV inspector, live KMIP client, and SDK analyzer for KMIPKit IDE plugins"
publish = false

[[bin]]
name = "kmip-lsp"
path = "src/main.rs"

[features]
default = ["live-client"]
live-client = ["dep:kmipkit-client", "dep:kmipkit-transport"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
kmipkit-client = { path = "../../crates/kmipkit-client", optional = true }
kmipkit-protocol = { path = "../../crates/kmipkit-protocol" }
kmipkit-transport = { path = "../../crates/kmipkit-transport", optional = true }
kmipkit-ttlv = { path = "../../crates/kmipkit-ttlv" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = { version = "=1.9.0", features = ["alloc"] }

[dev-dependencies]
kmipkit-test-server = { path = "../../crates/kmipkit-test-server" }
rcgen = "=0.14.10"

[lints.rust]
rust_2018_idioms = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
