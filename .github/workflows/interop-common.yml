name: Interop Common Foundation

on:
  pull_request:
    paths:
      - 'interop/shared/**'
      - 'interop/README.md'
      - 'specs/088-interop-contract-version-matrix/**'
      - 'docs/superpowers/plans/2026-11-10-interop-contract-version-matrix.md'
      - 'specs/092-interop-api-route-exhaustiveness/**'
      - 'docs/superpowers/plans/2026-11-10-kmipkit-0092-interop-api-route-exhaustiveness.md'
      - '.github/workflows/interop-common.yml'
  push:
    branches:
      - release/1.0.0
      - feature/KMIPKIT-0088-interop-contract-matrix
      - feature/KMIPKIT-0092-interop-api-route-exhaustiveness
    paths:
      - 'interop/shared/**'
      - 'interop/README.md'
      - 'specs/088-interop-contract-version-matrix/**'
      - 'docs/superpowers/plans/2026-11-10-interop-contract-version-matrix.md'
      - 'specs/092-interop-api-route-exhaustiveness/**'
      - 'docs/superpowers/plans/2026-11-10-kmipkit-0092-interop-api-route-exhaustiveness.md'
      - '.github/workflows/interop-common.yml'

permissions:
  contents: read

jobs:
  validate-common:
    name: Interop schemas and catalog validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # actions/setup-python v5.0.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install --only-binary ":all:" jsonschema==4.23.0

      - name: Verify test catalog generation check
        run: python3 interop/shared/catalog/generate_test_catalog.py --check

      - name: Verify canonical vectors generation check
        run: python3 interop/shared/vectors/generate_vectors.py --check

      - name: Validate installed public API route inventory
        run: python3 interop/shared/tools/route_capabilities.py --check

      - name: Expand planned case and route matrix
        run: python3 interop/shared/tools/coverage_matrix.py

      - name: Emit the consumer-readable route obligation matrix
        run: python3 interop/shared/tools/coverage_matrix.py --jsonl --output "$RUNNER_TEMP/kmipkit-coverage-matrix.jsonl"

      - name: Run interop shared tests
        run: python3 -B -m unittest discover -s interop/shared/tests -p 'test_*.py' -v
