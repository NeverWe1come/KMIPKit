name: Interop C Validator

on:
  pull_request:
    paths:
      - 'interop/c-kmip-validator/**'
      - 'interop/shared/**'
      - '.github/workflows/interop-c.yml'
  push:
    branches:
      - release/1.0.0
    paths:
      - 'interop/c-kmip-validator/**'
      - 'interop/shared/**'
      - '.github/workflows/interop-c.yml'

permissions:
  contents: read

jobs:
  validate-c:
    name: C KMIP 2.1 Validator Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up CMake and GCC
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure CMake
        run: cmake -S interop/c-kmip-validator -B interop/c-kmip-validator/build

      - name: Build C validator
        run: cmake --build interop/c-kmip-validator/build

      - name: Run C unit tests
        run: ctest --test-dir interop/c-kmip-validator/build --output-on-failure
