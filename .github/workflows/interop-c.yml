name: Interop C Validator

on:
  pull_request:
    paths:
      - 'verification/interop/c-kmip-validator/**'
      - 'verification/interop/shared/**'
      - '.github/workflows/interop-c.yml'
  push:
    branches:
      - release/1.0.0
    paths:
      - 'verification/interop/c-kmip-validator/**'
      - 'verification/interop/shared/**'
      - '.github/workflows/interop-c.yml'

permissions:
  contents: read

jobs:
  validate-c:
    name: C installed ABI and controlled KMIP peers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up CMake and GCC
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Build and verify the installed C ABI
        run: python3 verification/interop/c-kmip-validator/tools/install_artifact.py

      - name: Configure CMake
        run: |
          validator=verification/interop/c-kmip-validator
          install=$(PYTHONPATH="$validator/tools" python3 -c 'from artifact_support import INSTALL; print(INSTALL)')
          cmake -S "$validator" -B "$validator/build" -DKMIPKIT_C_INSTALL_DIR="$install"

      - name: Build C validator
        run: cmake --build verification/interop/c-kmip-validator/build

      - name: Run C unit tests
        run: ctest --test-dir verification/interop/c-kmip-validator/build --output-on-failure

      - name: Verify shared draft campaign evidence
        run: |
          python3 -m pip install --only-binary ':all:' 'jsonschema==4.23.0'
          validator=verification/interop/c-kmip-validator
          report_dir="$(mktemp -d)"
          python3 verification/interop/shared/tools/campaign.py --version 3.0 \
            --runner c "$validator/tools/draft_campaign.py" --output-dir "$report_dir"
          python3 -c 'import json,sys; s=json.load(open(sys.argv[1])); assert s["public_api"]["c"] == {"total": 7, "complete": 7}' "$report_dir/summary.json"
