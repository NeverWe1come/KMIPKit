name: Proxy OTC CI

on:
  pull_request:
    paths:
      - 'kmip-proxy/**'
      - '.github/workflows/proxy-otc.yml'
  push:
    branches:
      - release/1.0.0
      - release/1.0.0-review
    paths:
      - 'kmip-proxy/**'
      - '.github/workflows/proxy-otc.yml'

permissions:
  contents: read

jobs:
  validate-proxy-otc:
    name: KMIP Proxy Open Telekom Cloud KMS Provider Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check code formatting
        run: cargo fmt --manifest-path kmip-proxy/Cargo.toml --check

      - name: Lint with Clippy (OTC feature)
        run: cargo clippy --manifest-path kmip-proxy/Cargo.toml --all-targets --features otc -- -D warnings

      - name: Run unit and integration tests (OTC feature)
        run: cargo test --manifest-path kmip-proxy/Cargo.toml --features otc
