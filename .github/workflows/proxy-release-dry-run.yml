name: Proxy Release Packaging Dry-Run

on:
  pull_request:
    branches:
      - master
      - 'release/**'
    paths:
      - '.dockerignore'
      - '.github/workflows/proxy-release-dry-run.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/kmipkit-protocol/**'
      - 'crates/kmipkit-transport/**'
      - 'crates/kmipkit-ttlv/**'
      - 'deploy/**'
      - 'proxy/**'
      - 'tools/release_packaging/**'
      - 'vendor/aws-lc-sys-0.45.0/**'
  push:
    branches:
      - master
      - 'release/**'
    paths:
      - '.dockerignore'
      - '.github/workflows/proxy-release-dry-run.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/kmipkit-protocol/**'
      - 'crates/kmipkit-transport/**'
      - 'crates/kmipkit-ttlv/**'
      - 'deploy/**'
      - 'proxy/**'
      - 'tools/release_packaging/**'
      - 'vendor/aws-lc-sys-0.45.0/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-tests:
    name: Proxy tests (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - all-clouds
          - alibaba
          - aws
          - azure
          - gcp
          - ibm
          - infisical
          - oci
          - otc
          - scaleway
          - vault
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal --default 1.94

      - name: Test provider feature
        run: cargo test --locked --manifest-path proxy/kmipkit-proxy/Cargo.toml --no-default-features --features '${{ matrix.feature }}'

  proxy-images:
    name: Proxy image dry-run (${{ matrix.variant }})
    needs: provider-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: universal
            feature: all-clouds
            providers: 'alibaba aws azure gcp ibm infisical oci otc scaleway vault'
            tag: 1.0.0
          - variant: alibaba
            feature: alibaba
            providers: alibaba
            tag: 1.0.0-alibaba
          - variant: aws
            feature: aws
            providers: aws
            tag: 1.0.0-aws
          - variant: azure
            feature: azure
            providers: azure
            tag: 1.0.0-azure
          - variant: gcp
            feature: gcp
            providers: gcp
            tag: 1.0.0-gcp
          - variant: ibm
            feature: ibm
            providers: ibm
            tag: 1.0.0-ibm
          - variant: infisical
            feature: infisical
            providers: infisical
            tag: 1.0.0-infisical
          - variant: oci
            feature: oci
            providers: oci
            tag: 1.0.0-oci
          - variant: otc
            feature: otc
            providers: otc
            tag: 1.0.0-otc
          - variant: scaleway
            feature: scaleway
            providers: scaleway
            tag: 1.0.0-scaleway
          - variant: vault
            feature: vault
            providers: vault
            tag: 1.0.0-vault
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Build Linux x86-64 image
        env:
          IMAGE: kmipkit-proxy:${{ matrix.tag }}
        run: >-
          docker build --platform linux/amd64 --file deploy/Dockerfile
          --build-arg CLOUD_FEATURE='${{ matrix.feature }}'
          --build-arg PROXY_PROVIDERS='${{ matrix.providers }}'
          --build-arg KMIPKIT_VERSION=1.0.0
          --tag "$IMAGE" .

      - name: Verify compiled providers
        env:
          IMAGE: kmipkit-proxy:${{ matrix.tag }}
          EXPECTED_PROVIDERS: ${{ matrix.providers }}
        run: |
          actual="$(docker run --rm --entrypoint /usr/local/bin/kmipkit-proxy "$IMAGE" --list-providers | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$EXPECTED_PROVIDERS"

      - name: Save image archive
        env:
          IMAGE: kmipkit-proxy:${{ matrix.tag }}
          VARIANT: ${{ matrix.variant }}
        run: docker save "$IMAGE" --output "kmipkit-proxy-${VARIANT}.tar"

      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.1
        with:
          name: proxy-image-${{ matrix.variant }}
          path: kmipkit-proxy-${{ matrix.variant }}.tar
          if-no-files-found: error

  proxy-helm:
    name: Proxy Helm package dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm 3.17.3 and verify checksum
        run: |
          curl --fail --location --silent --show-error https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz --output /tmp/helm.tar.gz
          echo 'ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Lint and render universal and provider charts
        run: |
          set -euo pipefail
          chart=deploy/helm/kmipkit-proxy
          helm lint "$chart"
          helm template kmipkit-proxy "$chart" --set image.tag=1.0.0 --set config.provider=oci > /tmp/kmipkit-proxy-universal.yaml
          grep -q 'ghcr.io/neverwe1come/kmipkit-proxy:1.0.0' /tmp/kmipkit-proxy-universal.yaml
          for provider in alibaba aws azure gcp ibm infisical oci otc scaleway vault; do
            helm lint "$chart" --set image.tag="1.0.0-${provider}" --set config.provider="$provider"
            helm template kmipkit-proxy "$chart" --set image.tag="1.0.0-${provider}" --set config.provider="$provider" > "/tmp/kmipkit-proxy-${provider}.yaml"
            grep -q "ghcr.io/neverwe1come/kmipkit-proxy:1.0.0-${provider}" "/tmp/kmipkit-proxy-${provider}.yaml"
          done

      - name: Package chart once
        run: |
          mkdir -p dist/proxy/chart
          helm package deploy/helm/kmipkit-proxy --destination dist/proxy/chart

      - name: Upload Helm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.1
        with:
          name: proxy-helm-chart
          path: dist/proxy/chart/*.tgz
          if-no-files-found: error

  proxy-artifact-manifest:
    name: Proxy artifacts and checksums
    needs:
      - proxy-images
      - proxy-helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Download proxy packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact v7.0.0
        with:
          pattern: proxy-*
          path: dist/proxy
          merge-multiple: true

      - name: Assemble artifact inventory and SHA-256 checksums
        run: python -B tools/release_packaging/proxy_dry_run.py --input-dir dist/proxy --output-dir dist/proxy-evidence --version 1.0.0

      - name: Upload proxy release dry-run evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.1
        with:
          name: proxy-release-dry-run-evidence
          path: dist/proxy-evidence/
          if-no-files-found: error
