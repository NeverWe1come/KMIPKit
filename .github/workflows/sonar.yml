name: SonarQube Cloud Analysis

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

jobs:
  analyze:
    name: SonarQube Cloud scan
    if: >-
      vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compile Java sources for analysis
        run: mvn --batch-mode --file bindings/java/pom.xml -DskipTests compile

      - name: Verify Sonar token is configured
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the SONAR_TOKEN repository secret before enabling Sonar analysis.'
            exit 1
          fi

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # SonarSource/sonarqube-scan-action v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.java.binaries=bindings/java/target/classes
