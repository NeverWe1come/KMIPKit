name: Interop Java Validator

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'feature/**'
    paths:
      - 'interop/java-kmip-validator/**'
      - 'interop/shared/**'
      - '.github/workflows/interop-java.yml'
  pull_request:
    paths:
      - 'interop/java-kmip-validator/**'
      - 'interop/shared/**'
      - '.github/workflows/interop-java.yml'

jobs:
  validate-java:
    name: Build & Validate Java Project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interop/java-kmip-validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java Validator
        run: |
          mkdir -p build/classes
          javac -d build/classes \
            src/main/java/org/kmipkit/validator/models/*.java \
            src/main/java/org/kmipkit/validator/*.java \
            src/test/java/org/kmipkit/validator/*.java

      - name: Run Unit Tests
        run: |
          java -cp build/classes org.kmipkit.validator.ValidatorTest

      - name: Validate Against Cosmian Profile
        run: |
          java -cp build/classes org.kmipkit.validator.Main run \
            --capabilities ../shared/profiles/cosmian-kms.json \
            --output-dir ./results

      - name: Verify Output Reports Generated
        run: |
          test -f results/results.json
          test -f results/report.md
          test -f results/report.html
