name: Interop Java Validator

on:
  pull_request:
    paths:
      - 'verification/interop/java-kmip-validator/**'
      - 'verification/interop/shared/**'
      - 'bindings/java/**'
      - 'bindings/shared/fixtures/login-mtls/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verification/security/openssl/**'
      - '.github/actions/setup-static-openssl/**'
      - '.github/workflows/interop-java.yml'
  push:
    branches:
      - release/1.0.0
    paths:
      - 'verification/interop/java-kmip-validator/**'
      - 'verification/interop/shared/**'
      - 'bindings/java/**'
      - 'bindings/shared/fixtures/login-mtls/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verification/security/openssl/**'
      - '.github/actions/setup-static-openssl/**'
      - '.github/workflows/interop-java.yml'

permissions:
  contents: read

jobs:
  validate-java:
    name: Java installed consumer and KMIP 2.1 TLS fixture
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
    defaults:
      run:
        working-directory: verification/interop/java-kmip-validator
    steps:
      - name: Checkout the revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # actions/setup-python v5.0.0
        with:
          python-version: '3.12'

      - name: Install report and shared contract dependency
        run: pip install --only-binary ':all:' jsonschema==4.23.0

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build pinned static OpenSSL
        uses: $/.github/actions/setup-static-openssl

      - name: Build and install JNI from this revision
        shell: bash
        run: |
          build_log=$(mktemp)
          trap 'rm -f "$build_log"' EXIT
          for attempt in 1 2 3; do
            if python3 tools/install_artifact.py \
                --repository ../../.. \
                --maven-repository build/maven-repository \
                --manifest build/artifact-manifest.json 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if [[ $attempt == 3 ]] || ! grep -qE 'status code 429|HTTP (Error )?429' "$build_log"; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done

      - name: Test Java artifact installer
        run: python3 -B -m unittest discover -s tests -p 'test_install_artifact.py' -v

      - name: Test Java 17 consumer against the installed artifact
        run: |
          bash ../../../bindings/java/gradlew \
            -PkmipkitMavenRepo="$GITHUB_WORKSPACE/verification/interop/java-kmip-validator/build/maven-repository" \
            test installDist

      - name: Verify KMIP 2.x tag construction and controlled exchanges
        working-directory: .
        env:
          KMIPKIT_REQUIRED_INTEROP_VALIDATOR: java
          KMIPKIT_TABLE_EVIDENCE_DIR: ${{ runner.temp }}/kmip2x-table-evidence
        run: |
          python3 -B -m unittest discover -s verification/interop/shared/tests -p test_incoming_validators.py -v
          mkdir -p "$KMIPKIT_TABLE_EVIDENCE_DIR"
          python3 verification/interop/shared/tools/oasis_ttlv.py --version 2.0 --version 2.1 \
            --construct --require-complete --runner java verification/interop/java-kmip-validator/tools/run_draft_campaign.sh \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/oasis-construction.jsonl"
          python3 verification/interop/shared/tools/oasis_ttlv.py --version 2.0 --version 2.1 \
            --require-complete --runner java verification/interop/java-kmip-validator/tools/run_draft_campaign.sh \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/oasis-decode.jsonl"
          python3 verification/interop/shared/tools/table_ttlv.py \
            --runner java verification/interop/java-kmip-validator/tools/run_draft_campaign.sh \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/table-ttlv.json"
          python3 verification/interop/shared/tools/table_key_material.py \
            --runner java verification/interop/java-kmip-validator/tools/run_draft_campaign.sh \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/table-key-material.json"
          python3 verification/interop/shared/tools/table_typed_attributes.py \
            --runner java verification/interop/java-kmip-validator/tools/run_draft_campaign.sh \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/table-typed-attributes.json"

      - name: Upload KMIP 2.x table evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: java-kmip2x-table-evidence
          path: ${{ runner.temp }}/kmip2x-table-evidence

      - name: Validate generated Java report against the shared schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('../shared/schemas/validation-results.schema.json').read_text())
          report = json.loads(Path('build/offline-report/results.json').read_text())
          jsonschema.validate(report, schema)
          PY

      - name: Run shared catalog, profile, and report contract tests
        working-directory: .
        run: python3 -B -m unittest discover -s verification/interop/shared/tests -p 'test_*.py' -v
