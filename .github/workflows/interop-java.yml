name: Interop Java Validator

on:
  pull_request:
    paths:
      - 'interop/java-kmip-validator/**'
      - 'interop/shared/**'
      - 'bindings/java/**'
      - 'bindings/python/tests/fixtures/login-mtls/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/interop-java.yml'
  push:
    branches:
      - release/1.0.0
    paths:
      - 'interop/java-kmip-validator/**'
      - 'interop/shared/**'
      - 'bindings/java/**'
      - 'bindings/python/tests/fixtures/login-mtls/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.diff.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(interop/java-kmip-validator/|bindings/java/|bindings/python/tests/fixtures/login-mtls/|crates/|Cargo\.toml$|Cargo\.lock$)' <<< "$files"; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

  validate-java:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.affected == 'true'
    name: Java installed consumer and KMIP 2.1 TLS fixture
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
    defaults:
      run:
        working-directory: interop/java-kmip-validator
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # actions/setup-python v5.0.0
        with:
          python-version: '3.12'

      - name: Install report and shared contract dependency
        run: pip install --only-binary ':all:' jsonschema==4.23.0

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and install the pinned JNI package
        run: |
          python3 tools/install_artifact.py \
            --repository ../.. \
            --pin-file library-pin.json \
            --maven-repository build/maven-repository \
            --manifest build/artifact-manifest.json

      - name: Probe installed Java package public routes
        run: |
          python3 ../../interop/shared/tools/probe_route_artifact.py \
            --language java \
            --artifact build/maven-repository/org/kmipkit/kmipkit-java/1.0.0/kmipkit-java-1.0.0-linux-glibc-x86_64.jar \
            --provenance build/artifact-manifest.json | tee build/route-capability-probe.json

      - name: Upload Java route capability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: java-route-capability-evidence
          path: interop/java-kmip-validator/build/route-capability-probe.json
          if-no-files-found: error
          retention-days: 30

      - name: Test Java artifact installer path validation
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test Java 17 consumer against the installed artifact
        run: |
          bash ../../bindings/java/gradlew \
            -PkmipkitMavenRepo="$GITHUB_WORKSPACE/interop/java-kmip-validator/build/maven-repository" \
            test

      - name: Read installed Java artifact digest
        id: java-artifact
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("build/artifact-manifest.json").read_text())
          print(f"sha256={manifest['artifact_sha256']}")
          PY

      - name: Validate invoked Java routes and write the pending coverage ledger
        env:
          JAVA_ARTIFACT_SHA256: ${{ steps.java-artifact.outputs.sha256 }}
        run: |
          python3 ../../interop/shared/tools/validate_route_evidence.py \
            --selected-scope \
            --report build/route-execution-evidence.json \
            --artifact-sha256 "$JAVA_ARTIFACT_SHA256" \
            --write-ledger
          python3 tools/compare_route_ledger.py

      - name: Upload Java route execution evidence and coverage ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: java-route-execution-evidence
          path: |
            interop/java-kmip-validator/build/route-execution-evidence.json
            interop/java-kmip-validator/build/route-evidence-ledger.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate generated Java report against the shared schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('../shared/schemas/validation-results.schema.json').read_text())
          report = json.loads(Path('build/offline-report/results.json').read_text())
          jsonschema.validate(report, schema)
          PY

      - name: Run shared catalog, profile, and report contract tests
        working-directory: .
        run: python3 -B -m unittest discover -s interop/shared/tests -p 'test_*.py' -v
