name: Interop Rust Validator

on:
  pull_request:
    paths:
      - 'verification/interop/rust-kmip-validator/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verification/security/openssl/**'
      - '.github/actions/setup-static-openssl/**'
      - 'verification/interop/shared/**'
      - 'specs/084-interop-rust-live/**'
      - '.github/workflows/interop-rust.yml'
  push:
    branches:
      - release/1.0.0
      - feature/KMIPKIT-0084-interop-rust-live
    paths:
      - 'verification/interop/rust-kmip-validator/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'verification/security/openssl/**'
      - '.github/actions/setup-static-openssl/**'
      - 'verification/interop/shared/**'
      - 'specs/084-interop-rust-live/**'
      - '.github/workflows/interop-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rust:
    name: Rust 1.94 installed-package interoperability consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal --component rustfmt --component clippy --component llvm-tools

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Build and install packages from this revision
        run: python3 verification/interop/rust-kmip-validator/tools/install_artifact.py

      - name: Verify installed bytes and package provenance
        run: python3 verification/interop/rust-kmip-validator/tools/verify_artifact.py

      - name: Check code formatting
        run: cargo +1.94 fmt --manifest-path verification/interop/rust-kmip-validator/Cargo.toml --check

      - name: Check generated consumer dispatch
        run: |
          python3 verification/interop/rust-kmip-validator/tools/generate_local_cases.py
          git diff --exit-code -- verification/interop/rust-kmip-validator/src/local_cases_generated.rs

      - name: Lint with Clippy
        run: cargo +1.94 clippy --locked --manifest-path verification/interop/rust-kmip-validator/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run Rust tests and build the consumer
        run: |
          cargo +1.94 test --locked --manifest-path verification/interop/rust-kmip-validator/Cargo.toml --all-features
          cargo +1.94 build --locked --manifest-path verification/interop/rust-kmip-validator/Cargo.toml

      - name: Build isolated local test-server harness from this revision
        run: python3 verification/interop/rust-kmip-validator/tools/build_test_server.py

      - name: Create isolated fixture-test environment
        run: |
          python3 -m venv verification/interop/.local/rust-ci-venv
          verification/interop/.local/rust-ci-venv/bin/python -m pip install 'jsonschema==4.19.2'

      - name: Run controlled mTLS catalog, incoming, safety and parity checks
        env:
          KMIPKIT_EVIDENCE_DIR: verification/interop/rust-kmip-validator/results
        run: verification/interop/.local/rust-ci-venv/bin/python -m unittest discover -s verification/interop/rust-kmip-validator/tests -p test_live.py -v

      - name: Verify KMIP 2.x tag construction and controlled exchanges
        env:
          KMIPKIT_REQUIRED_INTEROP_VALIDATOR: rust
          KMIPKIT_TABLE_EVIDENCE_DIR: ${{ runner.temp }}/kmip2x-table-evidence
        run: |
          verification/interop/.local/rust-ci-venv/bin/python -B -m unittest discover -s verification/interop/shared/tests -p test_incoming_validators.py -v
          mkdir -p "$KMIPKIT_TABLE_EVIDENCE_DIR"
          verification/interop/.local/rust-ci-venv/bin/python verification/interop/shared/tools/oasis_ttlv.py --version 2.0 --version 2.1 \
            --construct --require-complete --runner rust verification/interop/rust-kmip-validator/target/debug/kmip30-campaign \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/oasis-construction.jsonl"
          verification/interop/.local/rust-ci-venv/bin/python verification/interop/shared/tools/oasis_ttlv.py --version 2.0 --version 2.1 \
            --require-complete --runner rust verification/interop/rust-kmip-validator/target/debug/kmip30-campaign \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/oasis-decode.jsonl"
          verification/interop/.local/rust-ci-venv/bin/python verification/interop/shared/tools/table_ttlv.py \
            --runner rust verification/interop/rust-kmip-validator/target/debug/kmip30-campaign \
            --output "$KMIPKIT_TABLE_EVIDENCE_DIR/table-ttlv.json"

      - name: Upload KMIP 2.x table evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: rust-kmip2x-table-evidence
          path: ${{ runner.temp }}/kmip2x-table-evidence

      - name: Install pinned Rust coverage tool
        run: cargo +1.94 install cargo-llvm-cov --version 0.9.1 --locked

      - name: Enforce 90 percent handwritten consumer line coverage
        run: verification/interop/.local/rust-ci-venv/bin/python verification/interop/rust-kmip-validator/tools/check_coverage.py

      - name: Confirm package integrity after consumer checks
        run: python3 verification/interop/rust-kmip-validator/tools/verify_artifact.py

      - name: Upload redacted controlled evidence and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: rust-interop-controlled-evidence
          path: |
            verification/interop/rust-kmip-validator/results/*.json
            verification/interop/.local/rust-live/provenance.json
            verification/interop/rust-kmip-validator/target/coverage.json
          if-no-files-found: error
