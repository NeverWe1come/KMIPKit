name: Release IDE Plugins

on:
  push:
    tags:
      - "ide-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    name: Build kmip-lsp (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_id: linux-x64
            bin: kmip-lsp
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform_id: linux-arm64
            bin: kmip-lsp
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_id: darwin-x64
            bin: kmip-lsp
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_id: darwin-arm64
            bin: kmip-lsp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_id: win32-x64
            bin: kmip-lsp.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-linker for linux-arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Test core (host)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --manifest-path ide-plugins/core/Cargo.toml
      - name: Build kmip-lsp
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --manifest-path ide-plugins/core/Cargo.toml --release --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-core/${{ matrix.platform_id }}
          cp ide-plugins/core/target/${{ matrix.target }}/release/${{ matrix.bin }} dist-core/${{ matrix.platform_id }}/
      - uses: actions/upload-artifact@v4
        with:
          name: kmip-lsp-${{ matrix.platform_id }}
          path: dist-core/${{ matrix.platform_id }}

  build-webview-and-vscode:
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: kmip-lsp-*
          path: ide-plugins/vscode/bin
          merge-multiple: true
      - name: Build and test webview-ui
        run: |
          cd ide-plugins/webview-ui
          npm ci
          npm test
          npm run build
      - name: Sync webview-ui bundle
        run: ./ide-plugins/scripts/build-webview.sh
      - name: Build and test VS Code extension
        run: |
          cd ide-plugins/vscode
          npm ci
          npm run compile
          npm test
      - name: Package VSIX
        run: |
          cd ide-plugins/vscode
          npx @vscode/vsce package --out ../kmipkit-vscode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: kmipkit-vscode-vsix
          path: ide-plugins/kmipkit-vscode.vsix

  build-jetbrains:
    needs: build-webview-and-vscode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build webview-ui & sync to JetBrains
        run: |
          cd ide-plugins/webview-ui
          npm ci
          npm run build
          cd ../..
          ./ide-plugins/scripts/build-webview.sh
      - name: Build, test, and verify JetBrains plugin
        uses: gradle/actions/setup-gradle@v4
      - run: |
          cd ide-plugins/jetbrains
          gradle test buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: kmipkit-jetbrains-zip
          path: ide-plugins/jetbrains/build/distributions/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/ide-v')
    needs: [build-core, build-webview-and-vscode, build-jetbrains]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - name: Build Zed WASM extension
        run: cargo build --manifest-path ide-plugins/zed/Cargo.toml --target wasm32-wasip1 --release
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Stage Zed WASM artifact
        run: |
          mkdir -p release-artifacts/zed
          cp ide-plugins/zed/target/wasm32-wasip1/release/kmipkit_zed.wasm release-artifacts/zed/
      - name: Generate SHA256SUMS
        run: ./ide-plugins/scripts/verify-checksums.sh release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*
            release-artifacts/SHA256SUMS
