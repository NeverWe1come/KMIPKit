name: CI

on:
  pull_request:
    branches:
      - master
      - release/**
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  core:
    if: github.event_name == 'pull_request'
    name: Core / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ['1.94', stable]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain and components
        id: install-rust-toolchain-and-components
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        id: check-formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        id: run-clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        id: run-workspace-tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        id: build-documentation
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Diagnose job result
        id: ci-diagnostics
        if: always()
        shell: pwsh
        env:
          CI_JOB_ID: ${{ github.job }}
          CI_MATRIX_JSON: ${{ toJSON(matrix) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_diagnostics.py'
          if (-not (Test-Path -LiteralPath $diagnosticScript -PathType Leaf)) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Checkout did not make the diagnostic script available. Open the failed checkout step log for the native error.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic script is unavailable.'
            exit 1
          }
          $python = Get-Command -Name python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name python3 -ErrorAction SilentlyContinue }
          if (-not $python) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Python 3 is unavailable on this runner, so the detailed job diagnosis could not be rendered.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'Python 3 is required to render CI job diagnostics.'
            exit 1
          }
          & $python.Source $diagnosticScript
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            '### ❌ Job diagnosis could not be written' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'The diagnostic renderer failed. Open the preceding job steps and this step log for details.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic renderer returned a non-zero exit code.'
            exit 1
          }

  script-contracts:
    if: github.event_name == 'pull_request'
    name: Script contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        id: set-up-python-3-12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # astral-sh/setup-uv v9.0.0
        with:
          version: '0.12.23'
          python-version: '3.12'
          activate-environment: true
          no-project: true

      - name: Install pinned Python contract dependencies
        id: install-pinned-python-contract-dependencies
        run: uv pip install --requirement tools/api_manifest/requirements-test.txt

      - name: Run Python contracts
        id: run-python-contracts
        shell: pwsh
        run: |
          $pythonRelativePath = if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' }
          $python = Join-Path $env:VIRTUAL_ENV $pythonRelativePath
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'The uv Python executable is missing.' }
          & $python -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B -m unittest discover -s tools/normative_catalog/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B -m unittest discover -s tools/api_manifest/tests -p 'test_extension_fixtures.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B tools/api_manifest/generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B tools/extension_fixtures/generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run PowerShell contracts
        id: run-powershell-contracts
        run: pwsh -File scripts/tests/Test-Wsl.ps1

      - name: Diagnose job result
        id: ci-diagnostics
        if: always()
        shell: pwsh
        env:
          CI_JOB_ID: ${{ github.job }}
          CI_MATRIX_JSON: ${{ toJSON(matrix) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_diagnostics.py'
          if (-not (Test-Path -LiteralPath $diagnosticScript -PathType Leaf)) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Checkout did not make the diagnostic script available. Open the failed checkout step log for the native error.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic script is unavailable.'
            exit 1
          }
          $python = Get-Command -Name python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name python3 -ErrorAction SilentlyContinue }
          if (-not $python) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Python 3 is unavailable on this runner, so the detailed job diagnosis could not be rendered.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'Python 3 is required to render CI job diagnostics.'
            exit 1
          }
          & $python.Source $diagnosticScript
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            '### ❌ Job diagnosis could not be written' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'The diagnostic renderer failed. Open the preceding job steps and this step log for details.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic renderer returned a non-zero exit code.'
            exit 1
          }

  language-bindings:
    if: github.event_name == 'pull_request'
    name: Language bindings / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the C ABI consumer on the VS 2022 image expected by CMake 3.31.
        os: [ubuntu-latest, windows-2022, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust 1.94
        id: install-rust-1-94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up Java 17
        id: set-up-java-17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Maven 3.9.16
        id: set-up-maven-3-9-16
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # stCarolas/setup-maven v5.1
        with:
          maven-version: '3.9.16'

      - name: Set up Python 3.12
        id: set-up-python-3-12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # astral-sh/setup-uv v9.0.0
        with:
          version: '0.12.23'
          python-version: '3.12'
          activate-environment: true
          no-project: true

      - name: Set up CMake 3.31.6
        id: set-up-cmake-3-31-6
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # lukka/get-cmake v4.4.2
        with:
          cmakeVersion: '3.31.6'
          ninjaVersion: '1.13.2'

      - name: Build the C consumer and example
        id: build-the-c-consumer-and-example
        run: |
          cargo build --locked -p kmipkit-ffi

      - name: Configure the C consumer with MSVC
        id: configure-the-c-consumer-with-msvc
        if: runner.os == 'Windows'
        run: cmake -G "Visual Studio 17 2022" -A x64 -S bindings/c -B build/c-consumer

      - name: Configure the C consumer with Ninja
        id: configure-the-c-consumer-with-ninja
        if: runner.os != 'Windows'
        run: cmake -G Ninja -S bindings/c -B build/c-consumer

      - name: Compile the C consumer and example
        id: compile-the-c-consumer-and-example
        run: |
          cmake --build build/c-consumer --config Release

      - name: Run the C consumer and example
        id: run-the-c-consumer-and-example
        shell: pwsh
        run: |
          if ($IsWindows) {
            $nativeLibraryDirectory = Join-Path $env:GITHUB_WORKSPACE 'target/debug'
            $env:PATH = "$nativeLibraryDirectory;$env:PATH"
          }
          ctest --test-dir build/c-consumer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Java 17 JNI tests and example
        id: run-java-17-jni-tests-and-example
        run: mvn --batch-mode --file bindings/java/pom.xml test

      - name: Build the Python Maturin CFFI package and run tests and example
        id: build-the-python-maturin-cffi-package-and-run-tests-and-exam
        shell: pwsh
        run: |
          uv pip install --requirement bindings/python/requirements-coverage.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --no-build-isolation bindings/python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q bindings/python/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python bindings/python/examples/vendor_extension_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose job result
        id: ci-diagnostics
        if: always()
        shell: pwsh
        env:
          CI_JOB_ID: ${{ github.job }}
          CI_MATRIX_JSON: ${{ toJSON(matrix) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_diagnostics.py'
          if (-not (Test-Path -LiteralPath $diagnosticScript -PathType Leaf)) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Checkout did not make the diagnostic script available. Open the failed checkout step log for the native error.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic script is unavailable.'
            exit 1
          }
          $python = Get-Command -Name python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name python3 -ErrorAction SilentlyContinue }
          if (-not $python) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Python 3 is unavailable on this runner, so the detailed job diagnosis could not be rendered.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'Python 3 is required to render CI job diagnostics.'
            exit 1
          }
          & $python.Source $diagnosticScript
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            '### ❌ Job diagnosis could not be written' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'The diagnostic renderer failed. Open the preceding job steps and this step log for details.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic renderer returned a non-zero exit code.'
            exit 1
          }

  ffi-sanitizer:
    if: github.event_name == 'pull_request'
    name: FFI sanitizer / Linux
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: nightly
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    outputs:
      diagnostic_details: ${{ steps.ci-diagnostics.outputs.diagnostic_details }}
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install nightly Rust
        id: install-nightly-rust
        run: rustup toolchain install nightly --profile minimal

      - name: Build the Rust C ABI under AddressSanitizer
        id: build-the-rust-c-abi-under-addresssanitizer
        run: cargo +nightly rustc --locked -p kmipkit-ffi --lib -- -Zsanitizer=address

      - name: Run the C consumer against the instrumented Rust FFI
        id: run-the-c-consumer-against-the-instrumented-rust-ffi
        run: |
          mkdir -p target/sanitizers
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address -fno-omit-frame-pointer -Ibindings/c/include bindings/c/tests/extension_registry.c -Ltarget/debug -Wl,-rpath,"$GITHUB_WORKSPACE/target/debug" -lkmipkit_ffi -o target/sanitizers/extension_registry_consumer
          target/sanitizers/extension_registry_consumer

      - name: Run the JNI zeroization owner test under native sanitizers
        id: run-the-jni-zeroization-owner-test-under-native-sanitizers
        run: |
          mkdir -p target/sanitizers
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer bindings/java/native/tests/zeroizing_bytes_test.cpp -o target/sanitizers/zeroizing_bytes_test
          target/sanitizers/zeroizing_bytes_test

      - name: Diagnose job result
        id: ci-diagnostics
        if: always()
        shell: pwsh
        env:
          CI_JOB_ID: ${{ github.job }}
          CI_MATRIX_JSON: ${{ toJSON(matrix) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_diagnostics.py'
          if (-not (Test-Path -LiteralPath $diagnosticScript -PathType Leaf)) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Checkout did not make the diagnostic script available. Open the failed checkout step log for the native error.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic script is unavailable.'
            exit 1
          }
          $python = Get-Command -Name python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name python3 -ErrorAction SilentlyContinue }
          if (-not $python) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Python 3 is unavailable on this runner, so the detailed job diagnosis could not be rendered.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'Python 3 is required to render CI job diagnostics.'
            exit 1
          }
          & $python.Source $diagnosticScript
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            '### ❌ Job diagnosis could not be written' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'The diagnostic renderer failed. Open the preceding job steps and this step log for details.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic renderer returned a non-zero exit code.'
            exit 1
          }

  fuzz-smoke:
    if: github.event_name == 'pull_request'
    name: Fuzz smoke / extension schema
    runs-on: ubuntu-latest
    outputs:
      diagnostic_details: ${{ steps.ci-diagnostics.outputs.diagnostic_details }}
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install nightly Rust
        id: install-nightly-rust
        run: rustup toolchain install nightly --profile minimal

      - name: Install pinned cargo-fuzz
        id: install-pinned-cargo-fuzz
        run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz the bounded extension schema target
        id: fuzz-the-bounded-extension-schema-target
        run: cargo +nightly fuzz run extension_schema -- -runs=1000 -max_len=4096 -timeout=5

      - name: Diagnose job result
        id: ci-diagnostics
        if: always()
        shell: pwsh
        env:
          CI_JOB_ID: ${{ github.job }}
          CI_MATRIX_JSON: ${{ toJSON(matrix) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_diagnostics.py'
          if (-not (Test-Path -LiteralPath $diagnosticScript -PathType Leaf)) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Checkout did not make the diagnostic script available. Open the failed checkout step log for the native error.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic script is unavailable.'
            exit 1
          }
          $python = Get-Command -Name python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name python3 -ErrorAction SilentlyContinue }
          if (-not $python) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Python 3 is unavailable on this runner, so the detailed job diagnosis could not be rendered.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'Python 3 is required to render CI job diagnostics.'
            exit 1
          }
          & $python.Source $diagnosticScript
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            '### ❌ Job diagnosis could not be written' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'The diagnostic renderer failed. Open the preceding job steps and this step log for details.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic renderer returned a non-zero exit code.'
            exit 1
          }

  normative-inventory:
    if: github.event_name == 'pull_request'
    name: Normative inventory / immutable sources and coverage
    runs-on: ubuntu-latest
    outputs:
      diagnostic_details: ${{ steps.ci-diagnostics.outputs.diagnostic_details }}
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned OASIS tree against exact PR base
        id: check-pinned-oasis-tree-against-exact-pr-base
        run: python3 -B tools/normative_catalog/check_immutable_sources.py --repo-root . --base-sha '${{ github.event.pull_request.base.sha }}'

      - name: Compare source candidates with reviewed clause ledger
        id: compare-source-candidates-with-reviewed-clause-ledger
        run: python3 -B tools/normative_catalog/audit_sources.py --repo-root . --base-sha '${{ github.event.pull_request.base.sha }}' --check

      - name: Validate complete normative catalog
        id: validate-complete-normative-catalog
        run: python3 -B tools/normative_catalog/validate.py --repo-root .

      - name: Verify generated coverage report
        id: verify-generated-coverage-report
        run: python3 -B tools/normative_catalog/report.py --repo-root . --check

      - name: Verify generated TTLV tag allocations
        id: verify-generated-ttlv-tag-allocations
        run: python3 -B tools/normative_catalog/generate_ttlv_tags.py --repo-root . --check

      - name: Verify generated result mappings
        id: verify-generated-result-mappings
        run: python3 -B tools/normative_catalog/generate_result_values.py --repo-root . --check

      - name: Diagnose job result
        id: ci-diagnostics
        if: always()
        shell: pwsh
        env:
          CI_JOB_ID: ${{ github.job }}
          CI_MATRIX_JSON: ${{ toJSON(matrix) }}
          CI_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          $diagnosticScript = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci_diagnostics.py'
          if (-not (Test-Path -LiteralPath $diagnosticScript -PathType Leaf)) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Checkout did not make the diagnostic script available. Open the failed checkout step log for the native error.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic script is unavailable.'
            exit 1
          }
          $python = Get-Command -Name python -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name python3 -ErrorAction SilentlyContinue }
          if (-not $python) {
            '### ❌ Job diagnosis could not run' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'Python 3 is unavailable on this runner, so the detailed job diagnosis could not be rendered.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'Python 3 is required to render CI job diagnostics.'
            exit 1
          }
          & $python.Source $diagnosticScript
          $diagnosticExitCode = $LASTEXITCODE
          if ($diagnosticExitCode -ne 0) {
            '### ❌ Job diagnosis could not be written' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            'The diagnostic renderer failed. Open the preceding job steps and this step log for details.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Write-Error 'The CI job diagnostic renderer returned a non-zero exit code.'
            exit 1
          }

  coverage:
    if: github.event_name == 'pull_request'
    name: Coverage / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        id: install-stable-rust
        run: rustup toolchain install stable --profile minimal

      - name: Install matching LLVM coverage tools
        id: install-matching-llvm-coverage-tools
        if: matrix.platform == 'ubuntu'
        run: rustup component add llvm-tools-preview --toolchain stable

      - name: Install pinned coverage tool
        id: install-pinned-coverage-tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Check production source eligibility
        id: source
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source scripts/coverage_gate.py preflight --workspace . --status-out coverage-status.json --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export LLVM JSON coverage
        id: export-llvm-json-coverage
        if: steps.source.outputs.eligible == 'true'
        run: cargo llvm-cov --workspace --all-features --locked --json --output-path coverage-raw.json

      - name: Normalize coverage paths
        id: normalize-coverage-paths
        if: steps.source.outputs.eligible == 'true'
        shell: pwsh
