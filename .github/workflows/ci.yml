        id: source
        shell: bash
        run: python scripts/coverage_gate.py preflight --workspace . --github-output "$GITHUB_OUTPUT"

      - name: Install pinned coverage tool
        id: install-coverage-tool
        if: steps.source.outputs.eligible == 'true'
        run: cargo +nightly install cargo-llvm-cov --version 0.9.1 --locked

      - name: Attempt informational branch coverage
        id: branch-report
        if: steps.source.outputs.eligible == 'true'
        run: cargo +nightly llvm-cov --workspace --all-features --locked --branch --json --summary-only

      - name: Summarize informational branch coverage
        id: summarize
        if: always()
        shell: bash
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          SOURCE_ELIGIBLE: ${{ steps.source.outputs.eligible }}
          NIGHTLY_INSTALL_RESULT: ${{ steps.install-nightly.outcome }}
          COVERAGE_TOOL_INSTALL_RESULT: ${{ steps.install-coverage-tool.outcome }}
          BRANCH_REPORT_RESULT: ${{ steps.branch-report.outcome }}
        run: |
          if [[ "$SOURCE_RESULT" != "success" || "$NIGHTLY_INSTALL_RESULT" != "success" ]]; then
            status="failed"
          elif [[ "$SOURCE_ELIGIBLE" != "true" ]]; then
            status="unavailable"
          elif [[ "$COVERAGE_TOOL_INSTALL_RESULT" != "success" || "$BRANCH_REPORT_RESULT" != "success" ]]; then
            status="failed"
          else
            status="passed"
          fi
          printf '### Informational branch coverage\n\n- Result: `%s`\n- This check is informational and does not gate pull-request CI.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
