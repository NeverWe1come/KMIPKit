name: CI

on:
  pull_request:
    branches:
      - master
      - release/**
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  core:
    if: github.event_name == 'pull_request'
    name: Core / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ['1.94', stable]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain and components
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  script-contracts:
    if: github.event_name == 'pull_request'
    name: Script contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run Python contracts
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run PowerShell contracts
        run: pwsh -File scripts/tests/Test-Wsl.ps1

  coverage:
    if: github.event_name == 'pull_request'
    name: Coverage / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Check production source eligibility
        id: source
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source scripts/coverage_gate.py preflight --workspace . --status-out coverage-status.json --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export LLVM JSON coverage
        if: steps.source.outputs.eligible == 'true'
        run: cargo llvm-cov --workspace --all-features --locked --json --output-path coverage-raw.json

      - name: Normalize coverage paths
        if: steps.source.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source scripts/coverage_gate.py normalize --workspace . --input coverage-raw.json --output coverage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload platform coverage report
        if: steps.source.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: coverage.json
          if-no-files-found: error

      - name: Upload explicit unavailable status
        if: steps.source.outputs.eligible == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: coverage-status.json
          if-no-files-found: error

  coverage-gate:
    if: always() && github.event_name == 'pull_request'
    name: Coverage gate / three platforms
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - name: Require successful platform coverage collection
        if: always() && needs.coverage.result != 'success'
        run: |
          echo "Coverage matrix completed with result: ${{ needs.coverage.result }}" >&2
          exit 1

      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download platform reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false

      - name: Enforce coverage thresholds
        run: python scripts/coverage_gate.py aggregate --workspace . --report-dir coverage-reports --base "${{ github.event.pull_request.base.sha }}" --merge "${{ github.sha }}"

  branch-coverage:
    name: Informational branch coverage / nightly
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal

      - name: Check production source eligibility
        id: source
        shell: bash
        run: python scripts/coverage_gate.py preflight --workspace . --github-output "$GITHUB_OUTPUT"

      - name: Install pinned coverage tool
        if: steps.source.outputs.eligible == 'true'
        run: cargo +nightly install cargo-llvm-cov --version 0.9.1 --locked

      - name: Attempt informational branch coverage
        if: steps.source.outputs.eligible == 'true'
        run: cargo +nightly llvm-cov --workspace --all-features --locked --branch --json --summary-only
