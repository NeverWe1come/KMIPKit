  coverage-gate:
    if: always() && github.event_name == 'pull_request'
    name: Coverage gate / platforms and adapters
    runs-on: ubuntu-latest
    needs:
      - coverage
      - adapter-coverage
    outputs:
      diagnostic_details: ${{ steps.ci-diagnostics.outputs.diagnostic_details }}
    steps:
      - name: Require successful platform and adapter coverage collection
        id: require-successful-platform-and-adapter-coverage-collection
        if: always() && (needs.coverage.result != 'success' || needs.adapter-coverage.result != 'success')
        run: |
          echo "Coverage matrix result: ${{ needs.coverage.result }}; adapter coverage result: ${{ needs.adapter-coverage.result }}" >&2
          exit 1

      - name: Summarize failed platform or adapter collection
        id: summarize-failed-platform-or-adapter-collection
        if: always() && (needs.coverage.result != 'success' || needs.adapter-coverage.result != 'success')
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ADAPTER_COVERAGE_RESULT: ${{ needs.adapter-coverage.result }}
        run: |
          printf '### Coverage gate\n\n**Result:** ❌ FAIL — platform or adapter collection did not complete.\n\n- Coverage matrix result: `%s`.\n- Adapter coverage result: `%s`.\n\n' "$COVERAGE_RESULT" "$ADAPTER_COVERAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pull request merge commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
