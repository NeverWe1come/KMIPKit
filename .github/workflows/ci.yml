  adapter-coverage:
    if: github.event_name == 'pull_request'
    name: Adapter coverage / Linux
    runs-on: ubuntu-latest
    needs:
      - language-bindings
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
    outputs:
      diagnostic_details: ${{ steps.ci-diagnostics.outputs.diagnostic_details }}
    steps:
      - name: Checkout pull request merge commit
        id: checkout-pull-request-merge-commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust 1.94
        id: install-rust-1-94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up Java 17
        id: set-up-java-17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Maven 3.9.16
        id: set-up-maven-3-9-16
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # stCarolas/setup-maven v5.1
        with:
          maven-version: '3.9.16'

      - name: Set up Python 3.12
        id: set-up-python-3-12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # astral-sh/setup-uv v9.0.0
        with:
          version: '0.12.23'
          python-version: '3.12'
          activate-environment: true
          no-project: true

      - name: Install LLVM 20.1.8 for JNI coverage
        id: install-llvm-20-1-8-for-jni-coverage
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # KyleMayes/install-llvm-action v2.0.9
        with:
          version: '20.1.8'
          directory: ${{ runner.temp }}/llvm-20

      - name: Add versioned LLVM tool names
        id: add-versioned-llvm-tool-names
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-20-tools"
          for tool in clang++ llvm-profdata llvm-cov; do
            ln -s "$LLVM_PATH/bin/$tool" "$RUNNER_TEMP/llvm-20-tools/${tool}-20"
          done
          echo "$RUNNER_TEMP/llvm-20-tools" >> "$GITHUB_PATH"

      - name: Run Java tests and collect JaCoCo report
        id: run-java-tests-and-collect-jacoco-report
        shell: bash
        run: |
          mvn --batch-mode --file bindings/java/pom.xml clean verify
          mkdir -p coverage-java
          cp bindings/java/target/site/jacoco/jacoco.xml coverage-java/jacoco.xml

      - name: Run Python coverage suite
        id: run-python-coverage-suite
        shell: bash
        run: |
          uv pip install --requirement bindings/python/requirements-coverage.txt
          uv pip install --no-build-isolation --editable bindings/python
          mkdir -p coverage-python
          python -m pytest -q bindings/python/tests \
            --cov=kmipkit \
            --cov-config=bindings/python/pyproject.toml \
            --cov-report=xml:coverage-python/coverage.xml

      - name: Run JNI coverage suite
        id: run-jni-coverage-suite
        shell: bash
        run: |
          bash scripts/collect_jni_coverage.sh target/coverage-jni
          mkdir -p coverage-jni
          cp target/coverage-jni/coverage.json coverage-jni/coverage.json

