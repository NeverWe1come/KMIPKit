name: CI

on:
  pull_request:
    branches:
      - master
      - release/**
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  core:
    if: github.event_name == 'pull_request'
    name: Core / ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","ARM64"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: ['1.94', stable]
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain and components
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  script-contracts:
    if: github.event_name == 'pull_request'
    name: Script contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","ARM64"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run Python contracts
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source -m unittest discover -s scripts/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python.Source -B -m unittest discover -s tools/normative_catalog/tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python.Source -B tools/api_manifest/generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run PowerShell contracts
        run: pwsh -File scripts/tests/Test-Wsl.ps1

  normative-inventory:
    if: github.event_name == 'pull_request'
    name: Normative inventory / immutable sources and coverage
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check pinned OASIS tree against exact PR base
        run: python3 -B tools/normative_catalog/check_immutable_sources.py --repo-root . --base-sha '${{ github.event.pull_request.base.sha }}'

      - name: Compare source candidates with reviewed clause ledger
        run: python3 -B tools/normative_catalog/audit_sources.py --repo-root . --base-sha '${{ github.event.pull_request.base.sha }}' --check

      - name: Validate complete normative catalog
        run: python3 -B tools/normative_catalog/validate.py --repo-root .

      - name: Verify generated coverage report
        run: python3 -B tools/normative_catalog/report.py --repo-root . --check

      - name: Verify generated TTLV tag allocations
        run: python3 -B tools/normative_catalog/generate_ttlv_tags.py --repo-root . --check

      - name: Verify generated result mappings
        run: python3 -B tools/normative_catalog/generate_result_values.py --repo-root . --check

  coverage:
    if: github.event_name == 'pull_request'
    name: Coverage / ${{ matrix.platform }}
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","ARM64"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Check production source eligibility
        id: source
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source scripts/coverage_gate.py preflight --workspace . --status-out coverage-status.json --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export LLVM JSON coverage
        if: steps.source.outputs.eligible == 'true'
        run: cargo llvm-cov --workspace --all-features --locked --json --output-path coverage-raw.json

      - name: Normalize coverage paths
        if: steps.source.outputs.eligible == 'true'
        shell: pwsh
        run: |
          $python = Get-Command -Name 'python3' -ErrorAction SilentlyContinue
          if (-not $python) { $python = Get-Command -Name 'python' -ErrorAction Stop }
          & $python.Source scripts/coverage_gate.py normalize --workspace . --input coverage-raw.json --output coverage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload platform coverage report
        if: steps.source.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: coverage.json
          if-no-files-found: error

      - name: Upload explicit unavailable status
        if: steps.source.outputs.eligible == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: coverage-status.json
          if-no-files-found: error

  coverage-gate:
    if: always() && github.event_name == 'pull_request'
    name: Coverage gate / three platforms
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    needs: coverage
    steps:
      - name: Require successful platform coverage collection
        if: always() && needs.coverage.result != 'success'
        run: |
          echo "Coverage matrix completed with result: ${{ needs.coverage.result }}" >&2
          exit 1

      - name: Summarize failed platform collection
        if: always() && needs.coverage.result != 'success'
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          printf '### Coverage gate\n\n**Result:** ❌ FAIL — platform collection did not complete.\n\n- Coverage matrix result: `%s`.\n\n' "$COVERAGE_RESULT" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout pull request merge commit
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download platform reports
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false

      - name: Enforce coverage thresholds
        id: enforce
        run: python scripts/coverage_gate.py aggregate --workspace . --report-dir coverage-reports --base "${{ github.event.pull_request.base.sha }}" --merge "${{ github.sha }}" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Summarize skipped coverage aggregation
        if: always() && needs.coverage.result == 'success' && steps.enforce.outcome == 'skipped'
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: |
          printf '### Coverage gate\n\n**Result:** ❌ FAIL — aggregation did not run.\n\n- Checkout result: `%s`.\n- Artifact download result: `%s`.\n\n' "$CHECKOUT_RESULT" "$DOWNLOAD_RESULT" >> "$GITHUB_STEP_SUMMARY"

  dependency-policy:
    name: Dependency policy / pull request
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run root and fuzz dependency policy
        shell: pwsh
        run: ./scripts/Test-DependencyPolicy.ps1

  scheduled-dependency-policy:
    name: Dependency policy / active release schedule
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.active-release.outputs.release_ref }}
      scanned_commit: ${{ steps.scanned-commit.outputs.scanned_commit }}
    env:
      ACTIVE_RELEASE_REF: release/1.0.0
    steps:
      - name: Checkout configured active release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ env.ACTIVE_RELEASE_REF }}
          persist-credentials: false

      - name: Report active release ref
        id: active-release
        shell: bash
        run: 'echo "Active release ref: $ACTIVE_RELEASE_REF"; echo "release_ref=$ACTIVE_RELEASE_REF" >> "$GITHUB_OUTPUT"'

      - name: Report scanned commit
        id: scanned-commit
        shell: bash
        run: 'sha="$(git rev-parse HEAD)"; echo "Scanned commit: $sha"; echo "scanned_commit=$sha" >> "$GITHUB_OUTPUT"'

      - name: Run root and fuzz dependency policy
        shell: pwsh
        run: ./scripts/Test-DependencyPolicy.ps1

  branch-coverage:
    name: Informational branch coverage / nightly
    runs-on: [self-hosted, Linux, ARM64]
    if: github.event_name == 'schedule'
    continue-on-error: true
    outputs:
      summary_status: ${{ steps.summarize.outputs.status }}
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install nightly Rust
        id: install-nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Check production source eligibility
        id: source
        shell: bash
        run: python scripts/coverage_gate.py preflight --workspace . --github-output "$GITHUB_OUTPUT"

      - name: Install pinned coverage tool
        id: install-coverage-tool
        if: steps.source.outputs.eligible == 'true'
        run: cargo +nightly install cargo-llvm-cov --version 0.9.1 --locked

      - name: Attempt informational branch coverage
        id: branch-report
        if: steps.source.outputs.eligible == 'true'
        run: cargo +nightly llvm-cov --workspace --all-features --locked --branch --json --summary-only

      - name: Summarize informational branch coverage
        id: summarize
        if: always()
        shell: bash
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
          SOURCE_ELIGIBLE: ${{ steps.source.outputs.eligible }}
          NIGHTLY_INSTALL_RESULT: ${{ steps.install-nightly.outcome }}
          COVERAGE_TOOL_INSTALL_RESULT: ${{ steps.install-coverage-tool.outcome }}
          BRANCH_REPORT_RESULT: ${{ steps.branch-report.outcome }}
        run: |
          if [[ "$SOURCE_RESULT" != "success" || "$NIGHTLY_INSTALL_RESULT" != "success" ]]; then
            status="failed"
          elif [[ "$SOURCE_ELIGIBLE" != "true" ]]; then
            status="unavailable"
          elif [[ "$COVERAGE_TOOL_INSTALL_RESULT" != "success" || "$BRANCH_REPORT_RESULT" != "success" ]]; then
            status="failed"
          else
            status="passed"
          fi
          printf '### Informational branch coverage\n\n- Result: `%s`\n- This check is informational and does not gate pull-request CI.\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

  run-summary:
    name: CI summary / at a glance
    if: always()
    runs-on: ${{ (github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","ARM64"]') || 'ubuntu-latest' }}
    needs:
      - core
      - script-contracts
      - normative-inventory
      - coverage
      - coverage-gate
      - dependency-policy
      - scheduled-dependency-policy
      - branch-coverage
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Write run summary
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_summary.py
