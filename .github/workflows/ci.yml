          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download platform and adapter reports
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: false

      - name: Enforce coverage thresholds
        id: enforce
        run: python scripts/coverage_gate.py aggregate --workspace . --report-dir coverage-reports --base "${{ github.event.pull_request.base.sha }}" --merge "${{ github.sha }}" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Summarize skipped coverage aggregation
        id: summarize-skipped-coverage-aggregation
        if: always() && needs.coverage.result == 'success' && needs.adapter-coverage.result == 'success' && steps.enforce.outcome == 'skipped'
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: |
          printf '### Coverage gate\n\n**Result:** ❌ FAIL — aggregation did not run.\n\n- Checkout result: `%s`.\n- Download result: `%s`.\n\n' "$CHECKOUT_RESULT" "$DOWNLOAD_RESULT" >> "$GITHUB_STEP_SUMMARY"

