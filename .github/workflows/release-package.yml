name: Release & Package

on:
  push:
    branches:
      - master
      - 'release/*-review'
  pull_request:
    branches:
      - master
      - 'release/*-review'
  workflow_dispatch:
    inputs:
      proxy_variants:
        description: 'Comma-separated proxy variants to build (or "all")'
        required: false
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions: {}

jobs:
  verify-version:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Verify SemVer X.Y.Z & release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.tag }}
      major: ${{ steps.semver.outputs.major }}
      minor: ${{ steps.semver.outputs.minor }}
      patch: ${{ steps.semver.outputs.patch }}
      publish_release: ${{ steps.mode.outputs.publish_release }}
      proxy_variants: ${{ steps.mode.outputs.proxy_variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Verify unified SemVer X.Y.Z across manifests
        id: semver
        run: python3 -B verification/release/verify_version.py --repo . --write-github-output

      - name: Determine workflow mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VARIANTS: ${{ github.event.inputs.proxy_variants }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF" = "refs/heads/master" ]; then
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=false" >> "$GITHUB_OUTPUT"
          fi
          variants="${INPUT_VARIANTS:-all}"
          echo "proxy_variants=${variants}" >> "$GITHUB_OUTPUT"

  package-rust:
    name: Package Rust crates (.crate)
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Package publishable Rust SDK & standalone kmipkit-ttlv crate
        run: |
          mkdir -p dist/rust
          cargo package --locked -p kmipkit-ttlv
          cp target/package/*.crate dist/rust/
          python3 -B verification/release/package_rust_sdk.py \
            --repo . \
            --output-dir dist/rust \
            --version "$RELEASE_VERSION" \
            --smoke-test

      - name: Upload Rust crate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-rust
          path: dist/rust/*
          if-no-files-found: error

  package-c:
    name: Package C SDK (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            target: linux-glibc-aarch64
          - os: windows-2022
            target: windows-x86_64-msvc
          - os: macos-latest
            target: macos-aarch64
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
      OPENSSL_STATIC: '1'
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      TARGET_ID: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # lukka/get-cmake v4.4.2

      - name: Build release kmipkit-ffi library
        run: cargo build --locked --release -p kmipkit-ffi

      - name: Package and smoke-test C SDK archive
        shell: pwsh
        run: |
          $python = Get-Command -Name python3 -ErrorAction SilentlyContinue
          if (-not $python -or $IsWindows) { $python = Get-Command -Name python }
          & $python.Source -B verification/release/package_c_sdk.py `
            --repo . `
            --target-dir target/release `
            --output-dir dist/c `
            --version "$env:RELEASE_VERSION" `
            --target "$env:TARGET_ID" `
            --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload C SDK archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-c-${{ matrix.target }}
          path: dist/c/*
          if-no-files-found: error

  package-java-api:
    name: Package Java API JAR
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java API JAR
        working-directory: bindings/java
        run: sh ./gradlew jar

      - name: Upload Java API JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-java-api
          path: bindings/java/build/libs/kmipkit-java-*.jar
          if-no-files-found: error

  package-java-native:
    name: Package Java native JAR (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            target: linux-glibc-aarch64
          - os: windows-2022
            target: windows-x86_64-msvc
          - os: macos-latest
            target: macos-aarch64
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
      OPENSSL_STATIC: '1'
      KMIPKIT_RUST_PROFILE: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # actions/setup-java v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and smoke-test release native JAR
        shell: pwsh
        working-directory: bindings/java
        run: |
          if ($IsWindows) {
            .\gradlew.bat nativeJar nativeJarSmoke
          } else {
            sh ./gradlew nativeJar nativeJarSmoke
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit packaged JNI public exports
        shell: pwsh
        run: |
          $python = Get-Command -Name python3 -ErrorAction SilentlyContinue
          if (-not $python -or $IsWindows) { $python = Get-Command -Name python }
          $nativeLibrary = Get-ChildItem -LiteralPath 'bindings/java/target/native' -File |
            Where-Object { $_.Name -like '*kmipkit_jni.*' } |
            Select-Object -First 1
          if (-not $nativeLibrary) { throw 'Built JNI native library not found.' }
          & $python.Source -B verification/api/audit_jni_public_exports.py --binary $nativeLibrary.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Java native JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-java-${{ matrix.target }}
          path: bindings/java/build/libs/kmipkit-java-*-${{ matrix.target }}.jar
          if-no-files-found: error

  package-python-sdist:
    name: Package Python sdist
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # astral-sh/setup-uv v9.0.0
        with:
          version: '0.12.23'
          python-version: '3.12'
          activate-environment: true
          no-project: true
          enable-cache: false

      - name: Build Python sdist with maturin
        working-directory: bindings/python
        run: |
          uv pip install --require-hashes --only-binary :all: --requirement ../../verification/release/requirements-python-build.txt
          maturin sdist --out ../../dist/python-sdist

      - name: Upload Python sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-python-sdist
          path: dist/python-sdist/*.tar.gz
          if-no-files-found: error

  package-python-wheel:
    name: Package Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            target: linux-glibc-aarch64
          - os: windows-2022
            target: windows-x86_64-msvc
          - os: macos-latest
            target: macos-aarch64
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: '1.94'
      OPENSSL_STATIC: '1'
      EXPECTED_VERSION: ${{ needs.verify-version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Install Rust 1.94
        run: rustup toolchain install 1.94 --profile minimal

      - name: Set up Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # astral-sh/setup-uv v9.0.0
        with:
          version: '0.12.23'
          python-version: '3.12'
          activate-environment: true
          no-project: true
          enable-cache: false

      - name: Build release wheel and run import smoke test
        shell: pwsh
        run: |
          uv pip install --require-hashes --only-binary :all: --requirement verification/release/requirements-python-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location bindings/python
          try {
            maturin build --release --locked --out ../../dist/python
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          $wheel = Get-ChildItem -LiteralPath dist/python -Filter '*.whl' | Select-Object -First 1
          if (-not $wheel) { throw 'No Python wheel produced.' }
          uv pip install --force-reinstall $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import kmipkit; info = kmipkit.metadata.get_version(); assert info.abi_version == 1; print('Python wheel smoke OK:', info)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Python wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-python-${{ matrix.target }}
          path: dist/python/*.whl
          if-no-files-found: error

  package-proxy:
    name: Package kmipkit-proxy (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: verify-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-glibc-x86_64
          - os: ubuntu-24.04-arm
            target: linux-glibc-aarch64
          - os: windows-2022
            target: windows-x86_64-msvc
          - os: macos-latest
            target: macos-aarch64
    env:
      CARGO_TERM_COLOR: always
      OPENSSL_STATIC: '1'
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      TARGET_ID: ${{ matrix.target }}
      PROXY_VARIANTS: ${{ needs.verify-version.outputs.proxy_variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned static OpenSSL
        uses: ./.github/actions/setup-static-openssl

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Build and package proxy variants
        shell: pwsh
        run: |
          $python = Get-Command -Name python3 -ErrorAction SilentlyContinue
          if (-not $python -or $IsWindows) { $python = Get-Command -Name python }
          & $python.Source -B verification/release/package_proxy.py `
            --repo . `
            --output-dir dist/proxy `
            --docker-staging-dir dist/docker-staging `
            --version "$env:RELEASE_VERSION" `
            --target "$env:TARGET_ID" `
            --variants "$env:PROXY_VARIANTS"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload proxy binary archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-proxy-${{ matrix.target }}
          path: dist/proxy/*
          if-no-files-found: error

      - name: Upload Linux proxy binaries for Docker multi-arch packaging
        if: startsWith(matrix.target, 'linux-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: docker-staging-${{ matrix.target }}
          path: dist/docker-staging/**
          if-no-files-found: error

  package-proxy-docker:
    name: Package proxy Docker (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: [verify-version, package-proxy]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - all-clouds
          - aws
          - azure
          - gcp
          - oci
          - vault
          - infisical
          - ibm
          - alibaba
          - scaleway
          - otc
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      MAJOR_VERSION: ${{ needs.verify-version.outputs.major }}
      MINOR_VERSION: ${{ needs.verify-version.outputs.minor }}
      PUBLISH_RELEASE: ${{ needs.verify-version.outputs.publish_release }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux x86_64 staged proxy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: docker-staging-linux-glibc-x86_64
          path: docker-context

      - name: Download Linux ARM64 staged proxy binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: docker-staging-linux-glibc-aarch64
          path: docker-context

      - name: Ensure staged binaries are executable
        run: chmod +x "docker-context/${VARIANT}/amd64/kmipkit-proxy" "docker-context/${VARIANT}/arm64/kmipkit-proxy"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # docker/setup-qemu-action v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # docker/setup-buildx-action v4.4.1

      - name: Log in to GitHub Container Registry (master only)
        if: needs.verify-version.outputs.publish_release == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # docker/login-action v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/kmipkit-proxy"
          if [ "$VARIANT" = "all-clouds" ]; then
            tags="${image}:${RELEASE_VERSION},${image}:${MAJOR_VERSION}.${MINOR_VERSION},${image}:${MAJOR_VERSION},${image}:latest"
            oci_tar="kmipkit-proxy-${RELEASE_VERSION}-oci.tar"
          else
            tags="${image}:${RELEASE_VERSION}-${VARIANT},${image}:${MAJOR_VERSION}.${MINOR_VERSION}-${VARIANT},${image}:${VARIANT}"
            oci_tar="kmipkit-proxy-${VARIANT}-${RELEASE_VERSION}-oci.tar"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "oci_tar=${oci_tar}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch OCI image (master)
        if: needs.verify-version.outputs.publish_release == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7.4.0
        with:
          context: docker-context
          file: kmip-proxy/Dockerfile
          target: ci-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PROXY_VARIANT=${{ matrix.variant }}
            KMIPKIT_VERSION=${{ needs.verify-version.outputs.version }}

      - name: Build and export multi-arch OCI tarball (non-master verification)
        if: needs.verify-version.outputs.publish_release != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7.4.0
        with:
          context: docker-context
          file: kmip-proxy/Dockerfile
          target: ci-runtime
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=dist/docker/${{ steps.tags.outputs.oci_tar }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PROXY_VARIANT=${{ matrix.variant }}
            KMIPKIT_VERSION=${{ needs.verify-version.outputs.version }}

      - name: Smoke-test Linux amd64 container image
        if: needs.verify-version.outputs.publish_release != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # docker/build-push-action v7.4.0
        with:
          context: docker-context
          file: kmip-proxy/Dockerfile
          target: ci-runtime
          platforms: linux/amd64
          load: true
          tags: kmipkit-proxy-smoke:${{ matrix.variant }}
          build-args: |
            PROXY_VARIANT=${{ matrix.variant }}
            KMIPKIT_VERSION=${{ needs.verify-version.outputs.version }}

      - name: Run container --help smoke check
        if: needs.verify-version.outputs.publish_release != 'true'
        run: docker run --rm "kmipkit-proxy-smoke:${VARIANT}" --help >/dev/null

      - name: Upload OCI image tarball (non-master)
        if: needs.verify-version.outputs.publish_release != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: dist-proxy-docker-${{ matrix.variant }}
          path: dist/docker/*.tar
          if-no-files-found: error

  assemble-release:
    name: Assemble release bundle, checksums & SBOM
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - package-rust
      - package-c
      - package-java-api
      - package-java-native
      - package-python-sdist
      - package-python-wheel
      - package-proxy
      - package-proxy-docker
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify-version.outputs.version }}
      RELEASE_TAG: ${{ needs.verify-version.outputs.tag }}
      PUBLISH_RELEASE: ${{ needs.verify-version.outputs.publish_release }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Download all packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          pattern: dist-*
          path: release-bundle/files
          merge-multiple: true

      - name: Generate SHA256SUMS.txt, CycloneDX SBOM, and Release Notes
        env:
          KMIPKIT_RELEASE_BUNDLE_DIR: release-bundle/files
        run: |
          python3 -B verification/release/generate_release_metadata.py \
            --version "$RELEASE_VERSION"

      - name: Upload assembled release bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: kmipkit-release-${{ needs.verify-version.outputs.version }}
          path: release-bundle/files/**
          retention-days: 30
          if-no-files-found: error

      - name: Generate build provenance attestation (master only)
        if: needs.verify-version.outputs.publish_release == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # actions/attest-build-provenance v4.2.2
        with:
          subject-path: release-bundle/files/*

      - name: Create or update Draft GitHub Release (master only)
        if: needs.verify-version.outputs.publish_release == 'true'
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-bundle/files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-bundle/files/* \
              --draft \
              --title "KMIPKit $RELEASE_TAG" \
              --notes-file release-bundle/files/RELEASE_NOTES.md
          fi
