name: zizmor

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']
  schedule:
    - cron: '43 4 * * 0'

permissions: {}

jobs:
  audit:
    name: Audit GitHub Actions workflows
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Scan workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # zizmor-action v0.8.0
        with:
          version: v1.31.1
          advanced-security: true
