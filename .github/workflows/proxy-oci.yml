name: Proxy OCI CI

on:
  pull_request:
    paths:
      - 'proxy/**'
      - '.github/workflows/proxy-oci.yml'
  push:
    branches:
      - release/1.0.0
    paths:
      - 'proxy/**'
      - '.github/workflows/proxy-oci.yml'

permissions:
  contents: read

jobs:
  validate-proxy-oci:
    name: KMIP Proxy Oracle OCI Provider Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check code formatting
        run: cargo fmt --manifest-path proxy/kmipkit-proxy/Cargo.toml --check

      - name: Lint with Clippy (OCI feature)
        run: cargo clippy --manifest-path proxy/kmipkit-proxy/Cargo.toml --all-targets --features oci -- -D warnings

      - name: Run unit and integration tests (OCI feature)
        run: cargo test --manifest-path proxy/kmipkit-proxy/Cargo.toml --features oci
