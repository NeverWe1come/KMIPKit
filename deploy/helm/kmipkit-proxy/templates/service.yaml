apiVersion: v1
kind: Service
metadata:
  name: {{ include "kmipkit-proxy.fullname" . }}
  labels:
    app.kubernetes.io/name: kmipkit-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: kmip
  selector:
    app.kubernetes.io/name: kmipkit-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
