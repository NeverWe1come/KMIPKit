apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kmipkit-proxy.fullname" . }}
  labels:
    app.kubernetes.io/name: kmipkit-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kmipkit-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kmipkit-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: kmipkit-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5696
              protocol: TCP
              name: kmip
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kmipkit
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "kmipkit-proxy.fullname" . }}-config
