[package]
name = "rust-kmip-validator"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust validation suite for KMIP 2.1 servers and KMIPKit conformance"
license = "Apache-2.0"

# Independent workspace so this project is not built with the KMIPKit library crates
[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"
