[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kmipkit-validator"
version = "1.0.0"
description = "Independent installed-package KMIP 2.0 and 2.1 interoperability consumer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema==4.23.0"]
authors = [
    { name = "KMIPKit Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
kmip-validator = "kmipkit_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
