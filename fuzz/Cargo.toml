[package]
name = "kmipkit-ttlv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
kmipkit-client = { path = "../crates/kmipkit-client", version = "1.0.0", features = ["fuzzing"] }
kmipkit-protocol = { path = "../crates/kmipkit-protocol", version = "1.0.0" }
kmipkit-transport = { path = "../crates/kmipkit-transport", version = "1.0.0", features = ["fuzzing"] }
kmipkit-ttlv = { path = "../crates/kmipkit-ttlv", version = "1.0.0" }
libfuzzer-sys = "=0.4.12"

[[bin]]
name = "ttlv_decode"
path = "fuzz_targets/ttlv_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extension_schema"
path = "fuzz_targets/extension_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_codec"
path = "fuzz_targets/json_codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_and_xml_preflight"
path = "fuzz_targets/wire_and_xml_preflight.rs"
test = false
doc = false
bench = false

[[bin]]
name = "s2c_and_multi_version"
path = "fuzz_targets/s2c_and_multi_version.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
resolver = "3"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints]
workspace = true
